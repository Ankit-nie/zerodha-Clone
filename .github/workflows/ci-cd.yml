name: TradeX CI/CD Pipeline — Test, Docker Build & Deploy

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================
  # STAGE 1: CONTINUOUS INTEGRATION (Lint, Test, Build, Audit)
  # ==========================================================
  backend-ci:
    name: CI — Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        run: npm ci

      - name: Run Backend syntax lint
        run: npm run lint

      - name: Run Backend unit & HTTP API tests
        run: npm test

  frontend-ci:
    name: CI — Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --forceExit

      - name: Build Frontend production bundle
        run: npm run build

      - name: Upload Frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/build
          retention-days: 7

  dashboard-ci:
    name: CI — Dashboard Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Dashboard unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --forceExit

      - name: Build Dashboard production bundle
        run: npm run build

      - name: Upload Dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build
          retention-days: 7

  security-audit:
    name: CI — DevSecOps Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm dependencies across services
        run: |
          echo "## DevSecOps Dependency Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Audit Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for dir in Backend Frontend dashboard; do
            echo "=== Auditing $dir ==="
            if (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              echo "| \`$dir\` | Passed (no high/critical production advisories) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$dir\` | Advisories reported (review workflow logs) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # ==========================================================
  # STAGE 2: DOCKER BUILD & PUSH TO CONTAINER REGISTRY (GHCR)
  # ==========================================================
  docker-build:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, dashboard-ci, security-audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./Backend
          - service: frontend
            context: ./Frontend
          - service: dashboard
            context: ./dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config --quiet

      - name: Determine push mode (push on main/develop/tags, verify-only on PR/feature)
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && (
            [ "${{ github.ref }}" = "refs/heads/main" ] ||
            [ "${{ github.ref }}" = "refs/heads/develop" ] ||
            [[ "${{ github.ref }}" == refs/tags/v* ]] ||
            [ "${{ github.event_name }}" = "workflow_dispatch" ]
          ); then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/tradex-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main/develop/tags) ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ==========================================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (Staging / Production)
  # ==========================================================
  deploy:
    name: CD — Deploy & Publish Summary
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: >-
      github.event_name != 'pull_request' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Trigger Render Deploy Hooks (if configured)
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          DASHBOARD_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
        run: |
          trigger_hook() {
            local name="$1"
            local hook="$2"
            if [ -n "$hook" ]; then
              echo "Triggering Render deploy hook for $name..."
              curl -fsSL -X POST "$hook"
              echo "$name deploy triggered."
            else
              echo "No Render deploy hook secret configured for $name (skipping webhook)."
            fi
          }

          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            trigger_hook "Backend" "$BACKEND_HOOK"
            trigger_hook "Frontend" "$FRONTEND_HOOK"
            trigger_hook "Dashboard" "$DASHBOARD_HOOK"
          else
            echo "Staging branch (${{ github.ref_name }}) published to GHCR; production Render hooks only run on main/tags."
          fi

      - name: Write End-to-End CI/CD Deployment Summary
        run: |
          REPO="${{ steps.env.outputs.repo }}"
          TAG="${{ github.ref_name }}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## TradeX CI/CD Deployment Summary
          - **Pipeline Stages:** CI (Lint, Tests, Build, Security Audit) -> Docker Build & Push -> Deploy
          - **Environment:** \`${{ steps.env.outputs.target }}\`
          - **Ref:** \`${{ github.ref }}\`
          - **Commit:** \`${{ github.sha }}\`

          ### Published Docker Images (GHCR)
          | Service | Image Reference |
          | --- | --- |
          | Backend | \`ghcr.io/${REPO}/tradex-backend:${TAG}\` |
          | Frontend | \`ghcr.io/${REPO}/tradex-frontend:${TAG}\` |
          | Dashboard | \`ghcr.io/${REPO}/tradex-dashboard:${TAG}\` |
          EOF
