name: CI Pipeline - Lint, Test, Build & Docker Verify

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        run: npm ci

      - name: Run Backend syntax lint
        run: npm run lint

      - name: Run Backend unit & API tests
        run: npm test

  frontend-ci:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --forceExit

      - name: Build Frontend production bundle
        run: npm run build

      - name: Upload Frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/build
          retention-days: 7

  dashboard-ci:
    name: Dashboard Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Dashboard unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --forceExit

      - name: Build Dashboard production bundle
        run: npm run build

      - name: Upload Dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build
          retention-days: 7

  docker-verify:
    name: Docker Compose & Image Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, dashboard-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./Backend
          - service: frontend
            context: ./Frontend
          - service: dashboard
            context: ./dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          tags: tradex-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  security-audit:
    name: DevSecOps Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm dependencies across services
        run: |
          echo "## DevSecOps Dependency Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Audit Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for dir in Backend Frontend dashboard; do
            echo "=== Auditing $dir ==="
            if (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              echo "| \`$dir\` | Passed (no high/critical production advisories) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$dir\` | Advisories reported (review workflow logs) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
