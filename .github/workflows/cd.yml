name: CD Pipeline - Publish Docker Images & Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Build & Push ${{ matrix.service }} Image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./Backend
          - service: frontend
            context: ./Frontend
          - service: dashboard
            context: ./dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/tradex-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Trigger Deployment & Publish Summary
    runs-on: ubuntu-latest
    needs: [publish-images]
    steps:
      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Trigger Render Deploy Hooks (if configured)
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          DASHBOARD_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
        run: |
          trigger_hook() {
            local name="$1"
            local hook="$2"
            if [ -n "$hook" ]; then
              echo "Triggering Render deploy hook for $name..."
              curl -fsSL -X POST "$hook"
              echo "$name deploy triggered."
            else
              echo "No Render deploy hook secret configured for $name (skipping webhook)."
            fi
          }

          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            trigger_hook "Backend" "$BACKEND_HOOK"
            trigger_hook "Frontend" "$FRONTEND_HOOK"
            trigger_hook "Dashboard" "$DASHBOARD_HOOK"
          else
            echo "Staging branch (${{ github.ref_name }}) published to GHCR; production Render hooks only run on main/tags."
          fi

      - name: Write Deployment Summary
        run: |
          REPO="${{ steps.env.outputs.repo }}"
          TAG="${{ github.ref_name }}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## TradeX CD Deployment Summary
          - **Environment:** \`${{ steps.env.outputs.target }}\`
          - **Ref:** \`${{ github.ref }}\`
          - **Commit:** \`${{ github.sha }}\`

          ### Published Docker Images (GHCR)
          | Service | Image Reference |
          | --- | --- |
          | Backend | \`ghcr.io/${REPO}/tradex-backend:${TAG}\` |
          | Frontend | \`ghcr.io/${REPO}/tradex-frontend:${TAG}\` |
          | Dashboard | \`ghcr.io/${REPO}/tradex-dashboard:${TAG}\` |
          EOF
