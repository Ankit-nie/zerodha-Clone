services:
  mongo:
    image: mongo:7
    container_name: tradex-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tradex-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: tradex-backend:latest
    container_name: tradex-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/tradex}
      TOKEN_KEY: ${TOKEN_KEY:-tradex-local-dev-jwt-secret-change-me}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tradex-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: tradex-frontend:latest
    container_name: tradex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - tradex-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: tradex-dashboard:latest
    container_name: tradex-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - tradex-network

volumes:
  mongo_data:

networks:
  tradex-network:
    driver: bridge
