services:
  # Optional local MongoDB container (enable with: docker compose --profile local-db up --build -d)
  # By default, Backend uses MONGO_URL from Backend/.env (e.g., MongoDB Atlas).
  mongo:
    image: mongo:7
    container_name: tradex-mongo
    profiles: ["local-db"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tradex-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: tradex-backend:latest
    container_name: tradex-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      PORT: 3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tradex-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: tradex-frontend:latest
    container_name: tradex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - tradex-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: tradex-dashboard:latest
    container_name: tradex-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - tradex-network

volumes:
  mongo_data:

networks:
  tradex-network:
    driver: bridge
